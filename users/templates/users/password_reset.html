{% extends 'base.html' %}
{% load static %}
{% block extra_auth_css %}<link rel="stylesheet" href="{% static 'users/auth.css' %}">{% endblock %}
{% block content %}
<div class="auth-container">
  <span class="auth-icon"><i class="fa fa-unlock-alt"></i></span>
  <h2 class="auth-title">Reset Password</h2>
  <form method="post" class="auth-form">
    {% csrf_token %}
    {{ form.email.label_tag }}
    {{ form.email }}
    {% if form.email.errors %}
      <div class="auth-error">{{ form.email.errors|striptags }}</div>
    {% endif %}
  <button type="submit" class="auth-btn" id="reset-btn"><span id="reset-btn-text"><i class="fa fa-paper-plane"></i> Send Reset Link</span> <i id="reset-btn-spinner" class="fa fa-spinner fa-spin" style="display:none;"></i></button>
  </form>

<script>
const resetForm = document.querySelector('.auth-form');
const resetBtn = document.getElementById('reset-btn');
const resetBtnText = document.getElementById('reset-btn-text');
const resetBtnSpinner = document.getElementById('reset-btn-spinner');
if (resetForm && resetBtn && resetBtnText && resetBtnSpinner) {
  resetForm.onsubmit = function() {
    resetBtn.disabled = true;
    resetBtnText.style.display = 'none';
    resetBtnSpinner.style.display = '';
  };
}
</script>
{% endblock %}
